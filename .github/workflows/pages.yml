name: Tests and GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest pipeline/tests -q
      - name: Rebuild site data from the committed snapshot and check it matches the committed file
        run: |
          python pipeline/build_sites.py
          git diff --ignore-matching-lines='"generated_at"' --exit-code -- web/data/sites.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Tag file links with the commit so browsers fetch new code after each deploy
        run: |
          V="${GITHUB_SHA::7}"
          sed -i -E "s/((src|href)=\"[^\":]+\.(js|css))\"/\1?v=$V\"/g" web/*.html
          sed -i -E "s/(@import url\(\"[^\"]+\.css)\"/\1?v=$V\"/g" web/*.css
          grep -c "?v=$V" web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Give the uploaded artifact time to appear (deploy-pages sometimes looks too soon)
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
